<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surface Kuralları</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont;
  background:#070913;
  color:white;
  overflow:hidden;
}

/* ANIMATED BACKGROUND */
.bg{
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle at 20% 20%, #7c5cff55, transparent 40%),
             radial-gradient(circle at 80% 80%, #00d4ff33, transparent 40%);
  animation:move 8s infinite alternate ease-in-out;
  z-index:0;
  filter:blur(40px);
}

@keyframes move{
  from{transform:scale(1) rotate(0deg);}
  to{transform:scale(1.2) rotate(10deg);}
}

/* CONTENT */
.container{
  position:relative;
  z-index:1;
  text-align:center;
  padding-top:60px;
}

/* HEADER */
h1{
  font-size:34px;
  color:#7c5cff;
  text-shadow:0 0 20px #7c5cff;
  cursor:pointer;
  transition:0.3s;
}

h1:hover{
  transform:scale(1.05);
}

p{
  opacity:0.6;
}

/* CARD */
.card{
  width:90%;
  max-width:700px;
  margin:40px auto;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(15px);
  border-radius:16px;
  padding:20px;
  box-shadow:0 0 30px rgba(0,0,0,0.5);
}

/* RULE */
.rule{
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  background:rgba(255,255,255,0.04);
  transition:0.2s;
}

.rule:hover{
  background:rgba(124,92,255,0.25);
  transform:scale(1.02);
}

.icon{
  color:#7c5cff;
  margin-right:8px;
}

/* BOTTOM TEXT */
.bottom{
  position:fixed;
  bottom:10px;
  right:15px;
  opacity:0.5;
  font-size:14px;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

<h1 onclick="window.open('https://discord.gg/hwH4BAcBAS','_blank')">
⌭ Surface Kuralları
</h1>

<p>Sunucu düzeni için kurallara uyun</p>

<div class="card">

  <div class="rule"><span class="icon">⌭</span> Spam / flood yasaktır</div>
  <div class="rule"><span class="icon">⌭</span> +18 içerik yasaktır</div>
  <div class="rule"><span class="icon">⌭</span> Reklam yasaktır</div>
  <div class="rule"><span class="icon">⌭</span> Hakaret yasaktır</div>
  <div class="rule"><span class="icon">⌭</span> Irkçılık yasaktır</div>
  <div class="rule"><span class="icon">⌭</span> Yetkili taklidi yasaktır</div>
  <div class="rule"><span class="icon">⌭</span> Siyasi tartışma yasaktır</div>

</div>

</div>

<div class="bottom">
qllahcan
</div>

</body>
</html>
