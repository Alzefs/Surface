<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surface Kuralları</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont;
  color:white;
  overflow:hidden;
}

/* BACKGROUND */
.bg{
  position:fixed;
  width:100%;
  height:100%;
  background:url("https://images.unsplash.com/photo-1541560052-5e137f229371") center/cover no-repeat;
  filter:brightness(0.35);
  z-index:0;
}

.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle at 20% 20%, #7c5cff33, transparent 40%);
  z-index:1;
}

/* RAIN */
canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:2;
}

/* NAV */
.nav{
  position:fixed;
  top:10px;
  left:10px;
  z-index:4;
  display:flex;
  gap:8px;
}

.nav button{
  padding:8px;
  border:none;
  border-radius:8px;
  background:#7c5cff;
  color:white;
  cursor:pointer;
}

/* PAGE */
.page{
  display:none;
  position:relative;
  z-index:3;
  height:100vh;
  padding:20px;
}

.page.active{display:block}

/* CARD */
.card{
  max-width:700px;
  margin:80px auto;
  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(15px);
  border-radius:16px;
  padding:20px;
}

/* RULE */
.rule{
  padding:10px;
  margin:8px 0;
  background:rgba(255,255,255,0.05);
  border-radius:10px;
}

/* CHAT */
#box{
  max-height:300px;
  overflow:auto;
  margin-bottom:10px;
}

input,button{
  padding:10px;
  border:none;
  border-radius:10px;
}

button{
  background:#7c5cff;
  color:white;
}

.bottom{
  position:fixed;
  bottom:10px;
  right:15px;
  opacity:0.5;
  z-index:5;
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>
<canvas id="rain"></canvas>

<!-- NAV -->
<div class="nav">
  <button onclick="go('rules')">📜</button>
  <button onclick="go('chat')">💬</button>
  <button onclick="go('music')">🎧</button>
</div>

<!-- RULES -->
<div class="page active" id="rules">
  <div class="card">
    <h1 style="color:#7c5cff;text-align:center"
    onclick="window.open('https://discord.gg/hwH4BAcBAS','_blank')">
      ⌭ Surface Kuralları
    </h1>

    <div class="rule">Spam / flood yasaktır</div>
    <div class="rule">+18 içerik yasaktır</div>
    <div class="rule">Reklam yasaktır</div>
    <div class="rule">Hakaret yasaktır</div>
    <div class="rule">Irkçılık yasaktır</div>
    <div class="rule">Yetkili taklidi yasaktır</div>
    <div class="rule">Siyasi tartışma yasaktır</div>
  </div>
</div>

<!-- CHAT -->
<div class="page" id="chat">
  <div class="card">
    <h2>Mini Chat</h2>

    <div id="box"></div>

    <input id="text" placeholder="Mesaj yaz...">
    <button onclick="send()">Gönder</button>
  </div>
</div>

<!-- MUSIC -->
<div class="page" id="music">
  <div class="card">
    <h2>Müzik</h2>

    <audio id="bgm" loop>
      <source src="music.mp3">
    </audio>

    <button onclick="bgm.play()">▶ Başlat</button>
    <button onclick="bgm.pause()">⏸ Dur</button>
  </div>
</div>

<div class="bottom">qllahcan</div>

<script>

/* NAV */
function go(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* CHAT */
function send(){
  let t=document.getElementById("text");
  if(!t.value.trim())return;

  let d=document.createElement("div");
  d.innerHTML="👤 "+t.value;
  document.getElementById("box").appendChild(d);

  t.value="";
}

/* RAIN */
const c=document.getElementById("rain");
const x=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

let drops=[];
for(let i=0;i<80;i++){
  drops.push({
    x:Math.random()*c.width,
    y:Math.random()*c.height,
    l:10,
    s:3+Math.random()*3
  });
}

function rain(){
  x.clearRect(0,0,c.width,c.height);

  for(let d of drops){
    x.beginPath();
    x.moveTo(d.x,d.y);
    x.lineTo(d.x,d.y+d.l);
    x.strokeStyle="#7c5cff";
    x.stroke();

    d.y+=d.s;
    if(d.y>c.height){
      d.y=0;
      d.x=Math.random()*c.width;
    }
  }

  requestAnimationFrame(rain);
}

rain();

</script>

</body>
</html>
