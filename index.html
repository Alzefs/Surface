<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Surface Final</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial;
    color: white;
}

/* CINEMATIC INTRO */
#intro {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    animation: fadeOut 3s ease forwards;
    animation-delay: 2s;
}

.intro-text {
    font-size: 90px;
    color: #00f0ff;
    text-shadow: 0 0 30px #00f0ff;
    animation: zoom 2s ease;
}

@keyframes zoom {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

@keyframes fadeOut {
    to { opacity: 0; visibility: hidden; }
}

/* BACKGROUND PARTICLES */
canvas {
    position: absolute;
    top: 0;
    left: 0;
}

/* MAIN */
.container {
    position: absolute;
    width: 100%;
    text-align: center;
    top: 15%;
}

/* GLITCH TITLE */
.title {
    font-size: 90px;
    color: #00f0ff;
    text-shadow: 0 0 25px #00f0ff;
    animation: glitch 1.5s infinite;
}

@keyframes glitch {
    0% { transform: translate(0); }
    25% { transform: translate(-2px,2px); }
    50% { transform: translate(2px,-2px); }
    75% { transform: translate(-1px,1px); }
    100% { transform: translate(0); }
}

/* CARD */
.card {
    margin: 50px auto;
    width: 55%;
    padding: 30px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    box-shadow: 0 0 50px rgba(0,240,255,0.2);
}

/* ICON */
.icon {
    font-size: 70px;
    color: #00f0ff;
    text-shadow: 0 0 25px #00f0ff;
}

/* SIGN */
.signature {
    position: absolute;
    bottom: 20px;
    right: 30px;
    color: #7adfff;
    font-style: italic;
}

/* MOUSE GLOW */
.cursor {
    position: fixed;
    width: 25px;
    height: 25px;
    background: #00f0ff;
    border-radius: 50%;
    pointer-events: none;
    mix-blend-mode: screen;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 40px #00f0ff;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
    <div class="intro-text">SURFACE</div>
</div>

<!-- BACKGROUND -->
<canvas id="c"></canvas>

<!-- CONTENT -->
<div class="container">
    <div class="title">SURFACE</div>

    <div class="card">
        <h2>Discord Kuralları</h2>
        <p>
        Spam / flood yasaktır<br>
        +18 içerik yasaktır<br>
        Reklam yasaktır<br>
        Hakaret yasaktır<br>
        Irkçılık yasaktır<br>
        Yetkili taklidi yasaktır<br>
        Siyasi tartışma yasaktır
        </p>
    </div>

    <div class="icon">⌭</div>
</div>

<div class="signature">- Article</div>

<div class="cursor" id="cursor"></div>

<script>

/* CURSOR */
const cursor = document.getElementById("cursor");
document.addEventListener("mousemove", e => {
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";
});

/* PARTICLE BACKGROUND */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<120;i++){
    particles.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*2,
        d: Math.random()*1
    });
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#00f0ff";

    for(let i=0;i<particles.length;i++){
        let p = particles[i];
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2,true);
        ctx.fill();

        p.y += p.d;
        if(p.y > canvas.height){
            p.y = 0;
            p.x = Math.random()*canvas.width;
        }
    }
    requestAnimationFrame(draw);
}
draw();

</script>

</body>
</html>
