<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surface Kuralları</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont;
  overflow:hidden;
  color:white;
}

/* 🌸 MULTI ANIME BACKGROUND SLIDESHOW */
.bg{
  position:fixed;
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  filter:brightness(0.45);
  transition:1.2s;
  transform:scale(1.05);
  z-index:0;
}

/* ✨ OVERLAY GLOW */
.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle at 25% 25%, #7c5cff33, transparent 50%),
             radial-gradient(circle at 75% 75%, #00d4ff22, transparent 50%);
  z-index:1;
}

/* 🌧 RAIN */
canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:2;
}

/* 📦 GLASS CARD */
.card{
  position:relative;
  z-index:3;
  width:90%;
  max-width:760px;
  margin:0 auto;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(20px);
  border-radius:18px;
  padding:25px;
  box-shadow:0 0 60px rgba(0,0,0,0.8);
  animation:float 5s ease-in-out infinite;
}

@keyframes float{
  0%{transform:translateY(-50%)}
  50%{transform:translateY(-52%)}
  100%{transform:translateY(-50%)}
}

/* 🟣 TITLE */
h1{
  text-align:center;
  color:#7c5cff;
  text-shadow:0 0 25px #7c5cff;
  cursor:pointer;
  letter-spacing:1px;
}

/* 📜 RULES */
.rule{
  padding:12px;
  margin:8px 0;
  background:rgba(255,255,255,0.05);
  border-radius:12px;
  transition:0.25s;
}

.rule:hover{
  background:rgba(124,92,255,0.25);
  transform:scale(1.03);
}

/* 🔘 BUTTON */
.btn{
  position:fixed;
  bottom:15px;
  left:15px;
  z-index:4;
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:#7c5cff;
  color:white;
  cursor:pointer;
  box-shadow:0 0 15px #7c5cff55;
}

/* 🔻 FOOTER */
.bottom{
  position:fixed;
  bottom:10px;
  right:15px;
  opacity:0.5;
  z-index:4;
  font-size:14px;
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>
<div class="overlay"></div>
<canvas id="rain"></canvas>

<!-- MUSIC -->
<audio id="bgm" loop>
  <source src="music.mp3">
</audio>

<button class="btn" onclick="bgm.play()">▶ Music</button>

<div class="card">

<h1 onclick="window.open('https://discord.gg/hwH4BAcBAS','_blank')">
⌭ Surface Kuralları
</h1>

<p style="text-align:center;opacity:0.6;">
Sunucu düzeni için kurallara uyun
</p>

<div class="rule">Spam / flood yasaktır</div>
<div class="rule">+18 içerik yasaktır</div>
<div class="rule">Reklam yasaktır</div>
<div class="rule">Hakaret yasaktır</div>
<div class="rule">Irkçılık yasaktır</div>
<div class="rule">Yetkili taklidi yasaktır</div>
<div class="rule">Siyasi tartışma yasaktır</div>

</div>

<div class="bottom">qllahcan</div>

<script>

/* 🌸 ANIME SLIDESHOW BACKGROUND */
const images = [
  "https://images5.alphacoders.com/129/1291451.jpg",
  "https://images.alphacoders.com/121/1214555.jpg",
  "https://images6.alphacoders.com/119/1192904.jpg"
];

let i = 0;
const bg = document.getElementById("bg");

function changeBG(){
  bg.style.backgroundImage = `url(${images[i]})`;
  i = (i + 1) % images.length;
}

changeBG();
setInterval(changeBG, 6000);

/* 🌧 RAIN SYSTEM */
const c = document.getElementById("rain");
const x = c.getContext("2d");

c.width = innerWidth;
c.height = innerHeight;

let drops = [];

for(let i=0;i<120;i++){
  drops.push({
    x:Math.random()*c.width,
    y:Math.random()*c.height,
    l:10,
    s:3+Math.random()*4
  });
}

function rain(){
  x.clearRect(0,0,c.width,c.height);

  for(let d of drops){
    x.beginPath();
    x.moveTo(d.x,d.y);
    x.lineTo(d.x,d.y+d.l);
    x.strokeStyle="rgba(124,92,255,0.6)";
    x.stroke();

    d.y += d.s;

    if(d.y > c.height){
      d.y = -20;
      d.x = Math.random()*c.width;
    }
  }

  requestAnimationFrame(rain);
}

rain();

</script>

</body>
</html>
